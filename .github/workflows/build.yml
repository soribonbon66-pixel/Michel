name: Build & Package Debug APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log
      - name: Publish Gradle diagnostics on failure
        if: failure()
        run: |
          {
            echo "## Gradle build diagnostics"
            echo '```text'
            tail -n 120 gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          filtered=$(grep -E '^(e: |w: |FAILURE:|\* What went wrong:|Execution failed for task|Could not |A problem occurred|Caused by:|> Task .* FAILED|> Compilation error)' gradle-build.log | tail -n 40 || true)
          if [ -z "$filtered" ]; then filtered=$(tail -n 20 gradle-build.log); fi
          filtered=${filtered//'%'/'%25'}
          filtered=${filtered//$'\r'/'%0D'}
          filtered=${filtered//$'\n'/'%0A'}
          filtered=${filtered//'::'/'%3A%3A'}
          printf '::error title=Gradle build failure::%s\n' "$filtered"
      - uses: actions/upload-artifact@v4
        with:
          name: Michel-PRO-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
